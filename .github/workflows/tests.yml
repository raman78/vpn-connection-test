name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        # tshark and dumpcap for the capture tests (skipped where absent).
        # On a desktop the wireshark group grants dumpcap its capabilities;
        # on the runner they are set on the binary instead, for the filter test.
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq tshark
          sudo setcap cap_net_raw,cap_net_admin+eip "$(command -v dumpcap)"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # hatch-vcs reads the version from the tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest -v
