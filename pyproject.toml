[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-connection-test"
version = "0.1.0"
description = "Compare direct and VPN network paths: per-connection RTT and loss, route probes, session logs"
requires-python = ">=3.11"

[project.scripts]
vpnct = "vpnct.cli:main"

[tool.setuptools]
packages = ["vpnct"]
